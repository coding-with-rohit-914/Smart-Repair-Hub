      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTechnicianProfileList'
          description: ''
components:
  schemas:
    ApprovalStatusEnum:
      enum:
      - PENDING
      - APPROVED
      - REJECTED
      type: string
      description: |-
        * `PENDING` - Pending
        * `APPROVED` - Approved
        * `REJECTED` - Rejected
    Booking:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        customer:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        technician:
          allOf:
          - $ref: '#/components/schemas/TechnicianProfile'
          readOnly: true
        service_detail:
          allOf:
          - $ref: '#/components/schemas/Service'
          readOnly: true
        has_payment:
          type: boolean
          readOnly: true
        has_review:
          type: boolean
          readOnly: true
        booking_id:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/BookingStatusEnum'
          readOnly: true
        problem_description:
          type: string
        preferred_date:
          type: string
          format: date
        preferred_slot:
          type: string
          maxLength: 20
        address:
          type: string
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        images:
          type: string
          format: uri
          nullable: true
        instructions:
          type: string
        estimated_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        final_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        technician_notes:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        service:
          type: integer
      required:
      - address
      - booking_id
      - created_at
      - customer
      - estimated_amount
      - final_amount
      - has_payment
      - has_review
      - id
      - preferred_date
      - preferred_slot
      - problem_description
      - service
      - service_detail
      - status
      - technician
      - technician_notes
      - updated_at
    BookingCreate:
      type: object
      properties:
        service:
          type: integer
        problem_description:
          type: string
        preferred_date:
          type: string
          format: date
        preferred_slot:
          type: string
          maxLength: 20
        address:
          type: string
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        images:
          type: string
          format: uri
          nullable: true
        instructions:
          type: string
      required:
      - address
      - preferred_date
      - preferred_slot
      - problem_description
      - service
    BookingStatusEnum:
      enum:
      - PENDING
      - ASSIGNED
      - ACCEPTED
      - ON_THE_WAY
      - ARRIVED
      - IN_PROGRESS
      - COMPLETED
      - PAID
      - CLOSED
      - REJECTED
      - CANCELLED
      type: string
      description: |-
        * `PENDING` - Pending
        * `ASSIGNED` - Technician Assigned
        * `ACCEPTED` - Accepted
        * `ON_THE_WAY` - On the Way
        * `ARRIVED` - Technician Arrived
        * `IN_PROGRESS` - Service Started
        * `COMPLETED` - Service Completed
        * `PAID` - Payment Completed
        * `CLOSED` - Closed
        * `REJECTED` - Rejected
        * `CANCELLED` - Cancelled
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 50
        icon:
          type: string
          maxLength: 10
        description:
          type: string
        services:
          type: array
          items:
            $ref: '#/components/schemas/Service'
          readOnly: true
      required:
      - id
      - name
      - services
    Notification:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 100
        body:
          type: string
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - body
      - created_at
      - id
      - title
    PaginatedBookingList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Booking'
    PaginatedCategoryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
