          description: ''
    put:
      operationId: api_technician_profile_update
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechnicianProfile'
          application/x-www-form-urlencoded:
            schema:
