openapi: 3.0.3
info:
  title: Smart Repair Hub API
  version: 1.0.0
  description: 'Backend API for the Smart Repair Hub appliance-repair platform: auth,
    catalog, bookings, payments, reviews, notifications and technicians.'
paths:
  /api/auth/change-password/:
    post:
      operationId: api_auth_change_password_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/_ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/_ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_MessageResponse'
          description: ''
        '400':
          description: No response body
  /api/auth/login/:
    post:
      operationId: api_auth_login_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/_LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/_LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_AuthResponse'
          description: ''
        '401':
          description: No response body
  /api/auth/otp/request/:
    post:
      operationId: api_auth_otp_request_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_OtpRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/_OtpRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/_OtpRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_MessageResponse'
          description: ''
        '404':
          description: No response body
        '429':
          description: No response body
  /api/auth/otp/verify/:
    post:
      operationId: api_auth_otp_verify_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_OtpVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/_OtpVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/_OtpVerifyRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_AuthResponse'
          description: ''
        '400':
          description: No response body
        '404':
          description: No response body
        '429':
          description: No response body
  /api/auth/password/request-otp/:
    post:
      operationId: api_auth_password_request_otp_create
      description: 'Forgot password, step 1: email -> hashed reset OTP.'
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_PasswordResetOtpRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/_PasswordResetOtpRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/_PasswordResetOtpRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_MessageResponse'
          description: ''
        '429':
          description: No response body
  /api/auth/password/reset/:
    post:
      operationId: api_auth_password_reset_create
      description: 'Forgot password, step 3: OTP + new password -> password changed.'
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_PasswordReset'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/_PasswordReset'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/_PasswordReset'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_MessageResponse'
          description: ''
        '400':
          description: No response body
        '429':
          description: No response body
  /api/auth/password/verify-otp/:
    post:
      operationId: api_auth_password_verify_otp_create
      description: |-
        Forgot password, step 2: confirm the code before showing the
        new-password form. The OTP stays valid for the final reset call.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_PasswordResetOtpVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/_PasswordResetOtpVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/_PasswordResetOtpVerify'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_MessageResponse'
          description: ''
        '400':
          description: No response body
        '429':
          description: No response body
  /api/auth/profile/:
    get:
      operationId: api_auth_profile_retrieve
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
    put:
      operationId: api_auth_profile_update
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Profile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Profile'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: ''
    patch:
